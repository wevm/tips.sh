name: Main
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm check

      - name: Typecheck
        run: pnpm check:types

  deploy:
    needs: check
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Mint deployment token
        id: cloudflare
        uses: wevm/actions/.github/actions/cloudflare-sts@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          policy: deploy-production
          ttl: 15m

      - name: Migrate D1
        uses: wevm/actions/vendor/cloudflare/wrangler-action/rev-9acf94ace14e@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          command: d1 migrations apply tips --remote
          accountId: ${{ steps.cloudflare.outputs.account-id }}
          apiToken: ${{ steps.cloudflare.outputs.token }}

      - name: Sync TIPs
        run: pnpm sync -- --remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account-id }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}

      - name: Build
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BASE_URL: https://tips.sh

      - name: Deploy
        uses: wevm/actions/vendor/cloudflare/wrangler-action/rev-9acf94ace14e@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          command: deploy
          accountId: ${{ steps.cloudflare.outputs.account-id }}
          apiToken: ${{ steps.cloudflare.outputs.token }}
