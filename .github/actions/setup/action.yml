name: Setup
description: Install pnpm, Node.js, and dependencies
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@8963daf30237417f873c8e2f17e3bf9415e3a7b9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
