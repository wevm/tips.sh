name: Setup
description: Install pnpm, Node.js, and dependencies
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@73e899a58d51092d694fbaf94b7a1d8c09bfea28

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
